  <style>
    :root { color-scheme: dark; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body { font-family: Inter, sans-serif; }
    .mono { font-family: "JetBrains Mono", monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    .panel-glow { box-shadow: 0 0 26px rgba(16,185,129,.055); }
    .flow-node { animation: nodeIn .35s ease both; }
    .flow-line { background: linear-gradient(to bottom, rgba(16,185,129,.55), rgba(63,63,70,.5)); }
    .code-fade { animation: codeIn .28s ease both; }
    .soft-pulse { animation: softPulse 2s ease-in-out infinite; }
    @keyframes nodeIn { from { opacity: .35; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes codeIn { from { opacity: .3; } to { opacity: 1; } }
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const pipelines = {
      rlis: {
        title: "Rural Logistics Intelligence System Flow Diagram",
        steps: [
          { stage: "Driver Log", desc: "Raw Hinglish logging ingress", code: `log = "Driver report: bypass road te crash hoya near GT road cross over"` },
          { stage: "Hinglish NLP", desc: "Text normalization and feature extraction", code: `normalized_log = normalize_hinglish(log)\nfeatures = tfidf_vectorizer.transform([normalized_log])\n# Bilingual incident text → model features` },
          { stage: "Incident Classification", desc: "Multi-class incident categorization", code: `prediction = classifier.predict(features)\n# Model output: incident category\n# Example label: ACCIDENT` },
          { stage: "Severity Assessment", desc: "Disruption indicators and incident context", code: `incident = {\n  "category": prediction[0],\n  "description": normalized_log\n}\n# Severity is assessed from incident context` },
          { stage: "PostGIS Resolution", desc: "Spatial query against road geometry", code: `SELECT ST_AsGeoJSON(geom)\nFROM punjab_roads\nWHERE name % 'GT road bypass';` },
          { stage: "Map Visualization", desc: "Incident and location payload for dashboard", code: `payload = {\n  "state": "active",\n  "location": resolved_geometry,\n  "category": incident["category"]\n}\n# Consumed by the GIS dashboard` },
          { stage: "Explainability", desc: "Expose useful classification context", code: `explanation = {\n  "input_text": normalized_log,\n  "predicted_category": prediction[0]\n}\n# Present model output with source context` }
        ]
      },
      insight: {
        title: "InsightLens Knowledge Graph Extraction Flow Diagram",
        steps: [
          { stage: "Document Upload", desc: "Validated document ingestion", code: `upload = await client.post(\n  "/documents",\n  files={"file": document}\n)\n# API accepts and validates the document` },
          { stage: "Text Extraction", desc: "Extract readable document content", code: `raw_text = document_parser.extract_content(\n  file_stream\n)\n# Convert supported document content to text` },
          { stage: "Entity Recognition", desc: "spaCy named entity recognition", code: `entities = spacy_ner(raw_text)\n# Example:\n# [('Aditya', 'PERSON'), ('Systems', 'ORG')]` },
          { stage: "Relationship Extraction", desc: "Derive semantic relationships", code: `relations = map_semantics(entities)\n# Example relation:\n# ('Aditya')-[:DEVELOPED]->('Systems')` },
          { stage: "Knowledge Graph Construction", desc: "Build nodes and relationship records", code: `nodes = build_graph_nodes(\n  entities,\n  relations\n)` },
          { stage: "Neo4j Storage", desc: "Persist graph relationships", code: `tx.run(\n  "MERGE (p:Person {name: $person}) "\n  "MERGE (o:Org {name: $org}) "\n  "MERGE (p)-[:RELATED_TO]->(o)",\n  person=person_name,\n  org=org_name\n)` }
        ]
      },
      smartcart: {
        title: "SmartCart-AI Recommendation Pipeline",
        steps: [
          { stage: "Interaction Dataset", desc: "Load user, product and interaction records", code: `users = read_csv("users.csv")\nproducts = read_csv("products.csv")\ninteractions = read_csv("interactions.csv")\n# Synthetic dataset: 500 users\n# 1,000 products · 15,000 interactions` },
          { stage: "Chronological Split", desc: "Preserve time order for evaluation", code: `train = interactions[date <= "2026-05-25"]\ntest  = interactions[date >  "2026-05-25"]\n# Training: 12,000 interactions\n# Testing:   3,000 interactions` },
          { stage: "Candidate Models", desc: "Compare recommendation strategies", code: `models = [\n  PopularityRecommender(),\n  ItemBasedCollaborativeFiltering(),\n  ContentBasedFiltering()\n]\n# Compare ranking quality on held-out data` },
          { stage: "Offline Evaluation", desc: "Measure Top-N recommendation quality", code: `metrics = evaluate_top_k(\n  model,\n  test,\n  k=10\n)\n# Precision@10 · Recall@10 · NDCG@10\n# Popularity baseline was strongest\n# in the recorded model comparison` },
          { stage: "Recommendation API", desc: "Serve ranked product recommendations", code: `@app.get("/recommendations/{user_id}")\ndef recommend(user_id: str):\n    # Load persisted recommendation artifacts\n    # Return ranked product IDs and metadata\n    ...` },
          { stage: "Fallback Strategy", desc: "Handle users without interaction history", code: `if user_has_history(user_id):\n    results = personalized_recommendations(user_id)\nelse:\n    results = popular_products()\n# Return a usable recommendation response` }
        ]
      },
      flokka: {
        title: "Flokka Document Intelligence Pipeline",
        steps: [
          { stage: "Document Upload", desc: "Accept files through the API", code: `job = await upload_document(file)\n# Validate file and create a processing job\nreturn {"job_id": job.id, "status": "queued"}` },
          { stage: "Text Extraction", desc: "Extract text from supported documents", code: `raw_text = extract_text(file)\n# OCR path supports image inputs\n# including JPEG documents` },
          { stage: "Chunking", desc: "Split text into overlapping segments", code: `chunks = split_text(\n  raw_text,\n  chunk_size=CHUNK_SIZE,\n  overlap=CHUNK_OVERLAP\n)` },
          { stage: "Embedding Generation", desc: "Encode chunks for semantic retrieval", code: `vectors = embedding_model.encode(chunks)\n# SentenceTransformer embeddings\n# generated for document chunks` },
          { stage: "Vector Indexing", desc: "Store vectors and chunk metadata", code: `collection.add(\n  documents=chunks,\n  embeddings=vectors,\n  ids=chunk_ids\n)\n# ChromaDB vector collection` },
          { stage: "Semantic Q&A", desc: "Retrieve relevant context for questions", code: `matches = collection.query(\n  query_embeddings=[question_vector],\n  n_results=TOP_K\n)\n# Retrieved chunks provide context\n# for document question answering` }
        ]
      }
    };

    const projects = [
      {
        key: "smartcart", number: "01", label: "Recommendation System", title: "SmartCart-AI",
        subtitle: "HYBRID E-COMMERCE PRODUCT RECOMMENDATION ENGINE",
        description: "A recommendation-engine project built around a synthetic e-commerce interaction dataset. It compares ranking approaches and exposes product recommendations through an application interface.",

        repoLabel: "GitHub profile",
        status: "Document AI project"
      },
      {
        key: "insight", number: "03", label: "Knowledge Graph System", title: "InsightLens Backend",
        subtitle: "DOCUMENT PROCESSING · ENTITY & RELATIONSHIP EXTRACTION",
        description: "A document intelligence backend that extracts entities and relationships from uploaded documents and stores structured connections in a Neo4j knowledge graph.",
        highlights: ["Document upload and text extraction", "spaCy named entity recognition", "Semantic relationship extraction", "Knowledge graph construction and Neo4j persistence"],
        tech: ["Python", "FastAPI", "spaCy", "Neo4j", "Docker"],
        repo: "https://github.com/MasterAditya/insightlens-backend",
        repoLabel: "Repository",
        status: "Knowledge graph project"

        description: "An AI-assisted rural logistics platform designed to transform unstructured English/Hinglish driver incident reports into structured incident information and geospatial views.",

      const [isPlaying, setIsPlaying] = useState(true);
      const [hoveredProject, setHoveredProject] = useState(null);
      const [selectedProject, setSelectedProject] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);

      const activeData = pipelines[activePipeline];

      useEffect(() => {
        if (!isPlaying) return;
        const timer = setInterval(() => {
          setPipelineStep(prev => (prev + 1) % pipelines[activePipeline].steps.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [activePipeline, isPlaying]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const openPipeline = (key) => {
        setActivePipeline(key);
        setPipelineStep(0);
        setIsPlaying(true);
        setSelectedProject(key);
        document.getElementById("architecture-explorer")?.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      const switchPipeline = (key) => {
        setActivePipeline(key);
        setPipelineStep(0);
        setIsPlaying(true);
      };

      const isActive = (key) => hoveredProject !== null ? hoveredProject === key : selectedProject === key;

      return (
        <div className="min-h-screen flex flex-col" onClick={() => {}}>

                <span className="h-2.5 w-2.5 rounded-full bg-emerald-500 soft-pulse"></span>
                <span className="font-bold tracking-tight text-white text-xs sm:text-sm">Aditya Sharma</span>
                <span className="text-zinc-700 text-xs hidden sm:inline">/</span>

                <a href="#architecture-explorer" onClick={() => setMenuOpen(false)} className="px-3 py-2 text-xs text-zinc-400 hover:text-emerald-400">System Deep Dive</a>
                <a href="#inventory" onClick={() => setMenuOpen(false)} className="px-3 py-2 text-xs text-zinc-400 hover:text-emerald-400">Tech Stack</a>
              </nav>
              <div className="flex items-center gap-2">
                <a href="https://github.com/MasterAditya" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 text-[11px] font-semibold py-2 px-3 rounded-lg text-zinc-300"><i data-lucide="github" className="w-3.5 h-3.5"></i><span className="hidden sm:inline">GitHub</span></a>
                <a href="https://linkedin.com/in/ursadityasharma" target="_blank" rel="noopener noreferrer" className="hidden sm:flex items-center gap-1.5 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 text-[11px] font-semibold py-2 px-3 rounded-lg text-zinc-300"><i data-lucide="linkedin" className="w-3.5 h-3.5"></i>LinkedIn</a>
                <a href="mailto:aditya.828777@gmail.com" className="hidden sm:flex items-center gap-1.5 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 text-[11px] font-semibold py-2 px-3 rounded-lg text-zinc-300"><i data-lucide="mail" className="w-3.5 h-3.5"></i>Contact</a>
                <a href="Aditya_Sharma_CV_2026.pdf" download className="flex items-center gap-1.5 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 text-[11px] font-semibold py-2 px-3 rounded-lg text-zinc-300"><i data-lucide="file-text" className="w-3.5 h-3.5"></i><span>Resume</span></a>

                    <span className="mono text-[9px] text-zinc-500 uppercase tracking-widest block">Developer Profile</span>

                    <p className="text-xs sm:text-sm text-zinc-400 font-semibold tracking-wide">Backend & AI Systems Developer</p>

            <section id="projects" className="space-y-6">

                    <div className="p-5 sm:p-6 space-y-4">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-[10px] font-bold text-zinc-400 bg-zinc-800/30 border border-zinc-700/40 px-2 py-1 rounded-md tracking-wider">{project.label}</span>

            <section id="architecture-explorer" className="space-y-6 pt-3">

                    <span className="mono text-[8px] text-zinc-500 uppercase tracking-widest block">System Flow Visualizer</span>

                    {activeData.steps.map((step,idx) => (
                      <div key={`${activePipeline}-${idx}`} className="flex flex-col">
                        <button onClick={() => {setPipelineStep(idx);setIsPlaying(false);}} className={`flow-node w-full text-left flex items-center gap-3 p-2 rounded-lg border transition-all ${pipelineStep === idx ? "bg-zinc-950 border-emerald-500/40 text-emerald-400 panel-glow" : "bg-transparent border-transparent text-zinc-400 hover:bg-zinc-900/40 hover:text-zinc-200"}`}>
                          <span className={`mono text-[9px] font-bold h-6 w-6 shrink-0 rounded flex items-center justify-center border ${pipelineStep === idx ? "border-emerald-500/50 text-emerald-400 bg-zinc-900" : "border-zinc-800 text-zinc-500 bg-zinc-950"}`}>{idx+1}</span>
                          <span className="flex-1 min-w-0"><span className={`block text-[11px] font-semibold ${pipelineStep === idx ? "text-emerald-400" : "text-zinc-300"}`}>{step.stage}</span><span className="block text-[9px] text-zinc-500 truncate">{step.desc}</span></span>
                          {pipelineStep === idx && <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 soft-pulse"></span>}
                        </button>
                        {idx < activeData.steps.length - 1 && <div className="h-2 flex items-center pl-[22px]"><div className="w-px h-full flow-line"></div></div>}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-6 bg-zinc-950 border border-zinc-800 rounded-xl p-4 sm:p-5 flex flex-col min-h-[300px]">
                  <div className="flex items-center justify-between border-b border-zinc-900 pb-3 mb-3 gap-3">
                    <div className="flex items-center gap-1.5"><div className="h-1.5 w-1.5 rounded-full bg-emerald-500 soft-pulse"></div><span className="mono text-[8px] text-zinc-400 font-bold uppercase">Specification Trace</span></div>
                    <div className="flex items-center gap-2">
                      <span className="mono text-[8px] text-zinc-600 hidden sm:inline">{isPlaying ? "AUTO TRACE · 4.5s" : "MANUAL TRACE"}</span>
                      <button onClick={() => setIsPlaying(v => !v)} className="text-[9px] px-2 py-1 rounded border border-zinc-800 text-zinc-400 hover:text-emerald-400 hover:border-emerald-500/30 flex items-center gap-1"><i data-lucide={isPlaying ? "pause" : "play"} className="w-3 h-3"></i>{isPlaying ? "Pause" : "Play"}</button>
                    </div>
                  </div>
                  <div className="flex-1 flex flex-col justify-between gap-4">
                    <div key={`${activePipeline}-${pipelineStep}`} className="code-fade">
                      <div className="flex items-center justify-between mb-2"><span className="text-[10px] text-emerald-400 font-semibold">{activeData.steps[pipelineStep].stage}</span><span className="mono text-[8px] text-zinc-600">STEP {String(pipelineStep+1).padStart(2,"0")} / {String(activeData.steps.length).padStart(2,"0")}</span></div>
                      <pre className="mono text-[10px] sm:text-[11px] text-zinc-300 overflow-x-auto whitespace-pre-wrap break-words py-4 px-4 min-h-[210px] leading-relaxed bg-[#060608] rounded-lg border border-zinc-900"><code>{activeData.steps[pipelineStep].code}</code></pre>
                    </div>
                    <div className="text-[10px] text-zinc-500 border-t border-zinc-900 pt-3 flex items-center justify-between gap-3"><span className="flex items-center gap-1.5"><i data-lucide="info" className="w-3.5 h-3.5 text-zinc-600"></i>Select stages to inspect specifications.</span><div className="flex gap-1"><button onClick={() => setPipelineStep(v => (v - 1 + activeData.steps.length) % activeData.steps.length)} className="px-2 py-1 border border-zinc-800 rounded hover:text-emerald-400" aria-label="Previous stage">←</button><button onClick={() => setPipelineStep(v => (v + 1) % activeData.steps.length)} className="px-2 py-1 border border-zinc-800 rounded hover:text-emerald-400" aria-label="Next stage">→</button></div></div>
                  </div>
                </div>
              </div>
            </section>

            <section id="inventory" className="space-y-4 !mt-8 sm:!mt-10 pt-5 border-t border-zinc-900">
              <div><h2 className="text-[10px] font-semibold uppercase tracking-widest text-zinc-500 mono flex items-center gap-2"><i data-lucide="server" className="w-3 h-3"></i> Technical Inventory</h2></div>
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                {[
                  ["Backend", "cpu", ["Python","FastAPI","REST APIs","AsyncIO"]],
                  ["Databases", "database", ["PostgreSQL","Redis","Neo4j","PostGIS","ChromaDB"]],
                  ["AI & ML", "activity", ["Scikit-Learn","TensorFlow","PyTorch","spaCy","NLP"]],
                  ["Infrastructure", "layers", ["Docker","Git","Linux"]],
                  ["Frontend", "layout", ["React","JavaScript","Tailwind CSS"]]
                ].map(([name,icon,items]) => <div key={name} className="border border-zinc-900/80 p-3.5 rounded-lg space-y-2 hover:border-emerald-500/30 transition-all group"><div className="flex items-center gap-1.5"><i data-lucide={icon} className="w-3.5 h-3.5 text-zinc-500 group-hover:text-emerald-400"></i><span className="text-[10px] font-bold text-zinc-300">{name}</span></div><div className="space-y-0.5">{items.map(t => <span key={t} className="block text-[10px] text-zinc-500 mono">{t}</span>)}</div></div>)}
              </div>
            </section>

            <section className="border border-zinc-800 bg-zinc-950/60 rounded-xl p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-5">
              <div><span className="mono text-[9px] text-emerald-400 uppercase tracking-widest">Contact</span><h2 className="text-lg font-bold mt-1">Let's build useful systems.</h2><p className="text-[11px] text-zinc-500 mt-1">Backend engineering · Applied AI/ML · Software development</p></div>
              <div className="flex flex-wrap gap-2"><a href="mailto:aditya.828777@gmail.com" className="text-[10px] font-semibold px-3 py-2 rounded-lg bg-emerald-500 text-black hover:bg-emerald-400">Email</a><a href="https://linkedin.com/in/ursadityasharma" target="_blank" rel="noopener noreferrer" className="text-[10px] font-semibold px-3 py-2 rounded-lg border border-zinc-800 text-zinc-300 hover:border-emerald-500/40">LinkedIn</a><a href="https://github.com/MasterAditya" target="_blank" rel="noopener noreferrer" className="text-[10px] font-semibold px-3 py-2 rounded-lg border border-zinc-800 text-zinc-300 hover:border-emerald-500/40">GitHub</a></div>
            </section>
          </main>

          <footer className="border-t border-zinc-900 bg-zinc-950 py-6 px-4 sm:px-6 lg:px-8 mt-5 text-xs text-zinc-500">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex flex-col items-center sm:items-start gap-0.5"><span className="font-medium text-zinc-400">Aditya Sharma</span><span className="text-[10px]">Backend & AI Systems Developer</span></div>
              <div className="flex items-center gap-2 text-[10px]"><span className="h-1.5 w-1.5 rounded-full bg-emerald-500"></span><span>Python · Backend · Applied AI</span></div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
